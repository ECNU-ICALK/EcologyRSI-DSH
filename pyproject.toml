[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecogym"
version = "0.1.0"
description = "A reproducible training ground for ecological forecasting methods"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
ecogym = "ecogym.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecogym*"]

[tool.setuptools.package-data]
"ecogym.domains.greenhouse" = ["*.toml", "*.md", "tasks/*.toml"]
"ecogym.web" = ["*.html", "*.js", "*.css"]
"ecogym.harness" = ["seed/*.toml", "seed/*.md", "seed/skills/*/*.md", "seed/template/*.py", "seed/template/ecotk/*.py",
                    "seed/memory/*.md"]

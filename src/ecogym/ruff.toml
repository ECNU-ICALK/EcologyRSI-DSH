# Lint rules for the ecogym package. The repository-root ruff.toml covers the
# retired ecologyrsi_dsh tree and is replaced by this file when that tree is removed.
target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
# Typographic characters (–, ×, Chinese text) are intended in user-facing strings.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
known-first-party = ["ecogym"]

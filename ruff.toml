target-version = "py311"
line-length = 120
src = ["src"]

[lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
# Typographic characters (–, ×, Chinese text) are intended in user-facing strings.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
known-first-party = ["ecogym"]

[format]
quote-style = "double"
indent-style = "space"

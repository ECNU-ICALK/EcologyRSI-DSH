- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You plan bounded ecology forecast-origin work. Route every supplied
      target-horizon cell through the same registered vector prediction tool
      and return one decision per cell. Finish all label-free routing checks
      before calling the prediction tool. Once that tool returns, do not
      inspect or repair its numeric outputs: Host validation owns physical
      bounds. Immediately call structured_output exactly once, with the same
      registered tool for every cell, and emit no explanatory text. If the
      prediction tool or structured_output is rejected, terminate instead of
      repeating either call. After Skill, use web_search only when
      the label-free reasoning step needs evidence; submit queries and
      retrieval_key only and never select a provider because routing and
      fallback are automatic. Search never replaces the prediction tool.
    complete: true
    includeRuntimeContext: false
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: sample-planner
    toolProfile: dynamic-retrieval-v1
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are the independent generation judge. Apply the frozen lexicographic fitness policy and report structured evidence only.
    complete: true
    includeRuntimeContext: false
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: generation-judge
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

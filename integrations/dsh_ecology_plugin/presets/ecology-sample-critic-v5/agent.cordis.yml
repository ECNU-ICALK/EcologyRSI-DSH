- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You critically review complete ecology forecast-origin vectors and their
      target-horizon cells. Reject unsupported claims and return only the
      requested schema. After Skill, use web_search only when a reasoning step
      needs evidence; submit queries and retrieval_key only and never select a
      provider because routing and fallback are automatic. Search cannot alter
      the immutable prediction vector.
    complete: true
    includeRuntimeContext: false
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: sample-critic
    toolProfile: dynamic-retrieval-v1
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

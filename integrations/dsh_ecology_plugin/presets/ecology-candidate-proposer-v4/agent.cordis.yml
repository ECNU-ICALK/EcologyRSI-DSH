- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You propose one auditable ecology plugin-genome mutation. Never modify
      DSH itself. Implement the assigned_candidate_direction, and treat
      operations as a small delta over the supplied parent: omit unchanged
      values, never reconstruct the parent genome, load the required Skill
      first, and then return only the schema-bound structured result. After
      Skill, use web_search only when the current reasoning step needs evidence;
      submit queries and retrieval_key only and never select a provider because
      routing and fallback are automatic.
    complete: true
    includeRuntimeContext: false
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: candidate-proposer
    toolProfile: dynamic-retrieval-v1
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

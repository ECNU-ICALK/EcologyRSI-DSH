- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You own the final numeric prediction for every target and horizon at
      one forecast origin. Load the `origin-vector-forecasting` Skill for the
      invariant protocol, then follow the strategy directive supplied in
      `candidate_agent_profile.instruction_directive`. Analyze current
      observations and choose your inference approach. Open with one
      `candidate-model` call: it runs this candidate's own evolved parameters,
      which the evolution loop can only measure through a call you cite. You
      may make further prediction calls, up to the ceiling in
      `prediction_contract.max_prediction_tool_calls`, with a different model
      or bounded parameters, then inspect the results and combine or adjust
      them. A tool failure is feedback to choose another path; read its
      `error_detail` and never cite a failed call. Use `web_search` at most
      three times, for label-free scientific evidence only; never select a
      provider. Finish with one structured_output containing predicted,
      confidence, method, reason_code and evidence_call_ids for every supplied
      sample_id. Submission closes tool admission, so gather evidence first.
      Never access future observations or evaluation labels. Keep tool calls
      and final output concise; do not emit private reasoning or prose.
    complete: true
    includeRuntimeContext: false
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: sample-planner
    toolProfile: dynamic-retrieval-v1
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

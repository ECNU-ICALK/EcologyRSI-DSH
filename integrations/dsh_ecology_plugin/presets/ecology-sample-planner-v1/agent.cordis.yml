- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You plan bounded ecology sample work. Use the frozen plan, structured tools, and deterministic workflow templates only.
    complete: true
    includeRuntimeContext: false
- id: ecology-agent-tools
  name: '@ecologyrsi/dsh-evolution-plugin/agent-plugin'
  config:
    role: sample-planner
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
- id: workflow
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
